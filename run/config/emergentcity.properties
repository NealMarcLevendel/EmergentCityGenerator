# Emergent historic city generator - configuration
# Units: metres, square metres, degrees as noted. All values are tunable prototype
# defaults, not universal historical facts.
# Lines starting with # are inactive; remove the # to override a value. In Minecraft, many values
# are derived from the command radius (mc.scaleToRadius) unless you override them here.

# ===== Growth loop (section G) =====
# Number of growth phases; analysis + feedback runs after each
#growth.phases=7
# Street proposals evaluated per phase (growth budget)
#growth.stepsPerPhase=280
# Soft growth radius around seeded centres in phase 0 (m)
#growth.initialRadius=140
# Growth radius increase per phase (m)
#growth.radiusPerPhase=55
# No streets closer than this to the terrain edge (m)
#growth.mapMargin=40
# Softmax temperature for controlled stochastic proposal selection
#growth.temperature=0.3
# Candidate heading changes per step (degrees)
#growth.turnSamplesDeg=-18,-11,-5,-2,0,2,5,11,18
# Largest heading change per segment; with segment length sets min bend radius
#growth.maxTurnDeg=18
# 0..1 persistence of gentle bends (section C curvature strength)
#growth.curvatureStrength=0.4
# Hard minimum angle between streets meeting at a node
#growth.minJunctionAngleDeg=38
# Hard minimum angle when a new street meets an existing one
#growth.minCrossAngleDeg=40
# Segment length for local lanes (m)
#growth.segmentLength.local=22
# Segment length for connectors (m)
#growth.segmentLength.connector=28
# Segment length for primary streets (m)
#growth.segmentLength.primary=34
# Look-ahead factor: connect to a street within this many segment lengths
#growth.lookAhead=1.6
# Snap to an existing node within this fraction of segment length
#growth.snapNodeFraction=0.45
# When hitting a street this close to its end node, join the node (m)
#growth.snapEndpoint=7
# Hard minimum street segment length (m)
#growth.minSegment=7
# Free street ends must keep this clearance from other streets (m)
#growth.clearanceFree=22
# Streets running alongside each other leave at least this much buildable depth between them (m), so the block holds two rows of plots and a courtyard (0 = off)
#growth.minBlockDepth=0
# How far a boulevard runs from the main centre, as a share of the town radius, before ending in its own square
#growth.boulevardReach=0.6
# Distance between side streets branching off a boulevard (m)
#growth.boulevardBranchSpacing=40
# Clearance between new geometry and unrelated nodes (m)
#growth.clearanceNode=9
# Reject connections that would close a block smaller than this perimeter (m)
#growth.minLoopPerimeter=190
# Closing loops up to this perimeter earns the full connection bonus (m)
#growth.goodLoopPerimeterMax=460
# Search limit for loop-perimeter estimation (m)
#growth.maxLoopSearch=700
# Branching becomes possible after this much frontage since last branch (m)
#growth.branchFrontageMin=50
# Branching is near-certain after this much frontage (m)
#growth.branchFrontageMax=100
# Std-dev of branch angle around 90 degrees
#growth.branchAngleJitterDeg=15
# Hard max grade for local lanes
#growth.maxGrade.local=0.16
# Hard max grade for connectors
#growth.maxGrade.connector=0.12
# Hard max grade for primary streets
#growth.maxGrade.primary=0.09
# Longest permitted bridge water span (m)
#growth.bridgeMaxLength=70
# Maximum number of bridges (scarcity)
#growth.maxBridges=3
# Bridges only after this phase
#growth.bridgeMinPhase=2
# Approach roads seeded from each initial centre
#growth.seedRoads=4
# Max passages/streets cutting oversize blocks per phase
#growth.infillPerPhase=14
# Max dead-end repair attempts per phase
#growth.repairPerPhase=20

# ===== Proposal cost weights (lambda terms of E, section H) =====
# Terrain grade cost weight (E_terrain)
#w.grade=1.2
# Deviation from smooth persistent curvature (E_streets)
#w.curvature=0.6
# Small penalty for perfectly straight unaimed segments
#w.straight=0.15
# Penalty for straight runs beyond max vista with no endpoint (E_vistas)
#w.vista=1.4
# Bonus for growing toward centres and density (E_accessibility/E_centers)
#w.attraction=1.0
# Soft penalty for exceeding the current growth radius
#w.radius=2.0
# Bonus for joining the network and closing good-sized blocks (E_blocks)
#w.connect=0.8
# Cost of a bridge
#w.bridge=1.5
# Bonus for streets aimed at a landmark (purposeful vista)
#w.landmarkAxis=0.8

# ===== Centres and landmarks (section A) =====
# Seeded centres (1-5); location chosen by terrain suitability, not coordinates
#centers.initialCount=1
# Maximum total centres (seeded + emergent)
#centers.max=4
# Base attraction of a seeded centre (0-1)
#centers.attraction=0.9
# Minimum distance between centres (m)
#centers.minSpacing=320
# Houses within 130 m needed for an emergent centre
#centers.densityThreshold=55
# Sum of incident normalised demand needed for an emergent centre
#centers.convergenceThreshold=1.5
# Emergent centres only from this phase
#centers.minPhase=3
# 0..1 preference for siting the first centre near (not on) water
#centers.waterAffinity=1.0
# Maximum monumental landmarks (scarcity)
#landmark.max=3
# Minimum height / principal facade width for monuments
#landmark.minHeightToWidth=1.0
# Centre strength needed before a landmark is built
#landmark.strengthThreshold=0.45
# Houses within 200 m needed before a landmark is built
#landmark.minHouses=45
# Cathedral facade width target (m)
#landmark.cathedral.width=28
# Cathedral nave depth target (m)
#landmark.cathedral.depth=62
# Civic/market hall facade width target (m)
#landmark.hall.width=24
# Civic/market hall depth target (m)
#landmark.hall.depth=26
# Straight boulevards laid out from the main centre (0-4; 2 = one avenue straight through the centre). Enable with the 'boulevards' command option
#mc.boulevards=0
# Boulevard width (m); scaled to the radius in Minecraft
#street.boulevard.width=14
# Preferred area of a centre's square (m2): the block beside the centre closest to this becomes the square
#plaza.blockTarget=1200
# Largest block that may become a centre's square (m2; 40% more for a monument's square)
#plaza.blockMaxArea=3200
# Smallest block that may become a square (m2)
#plaza.blockMinArea=150
# Largest block that may become a junction square away from the centres (m2)
#plaza.smallMaxArea=1000
# Monuments stand free in the middle of their squares, which grow by merging blocks (command option 'freestanding')
#mc.freestanding=false
# A free-standing monument's square: this many times the monument's footprint plus a 6 m margin all round
#plaza.freeFactor=1.6
# Build one oversized landmark (a grand cathedral) with a square to match; off by default, enable with the 'grand' command option
#landmark.grand=false
# Size of the grand landmark relative to an ordinary cathedral
#landmark.grandScale=1.5
# Largest plaza radius (m); the grand landmark's square may exceed it to stay in proportion
#plaza.maxRadius=70
# Allow one Baroque-style straight approach aimed at the main landmark
#landmark.enableAxis=true
# Maximum length of that approach axis (m)
#landmark.axisMaxLength=320

# ===== Streets (sections B, C, F) =====
# Local lane min width (m)
#street.local.min=4.5
# Local lane max width (m)
#street.local.max=8
# Connector min width (m)
#street.connector.min=8
# Connector max width (m)
#street.connector.max=14
# Primary street min width (m)
#street.primary.min=14
# Primary street max width (m)
#street.primary.max=22
# Civic approach min width (m)
#street.civic.min=18
# Civic approach max width (m)
#street.civic.max=28
# Normalised demand for primary class
#street.primaryDemand=0.8
# Normalised demand for connector class
#street.connectorDemand=0.55
# Demand drop tolerated before a street is downgraded
#street.classHysteresis=0.05
# Max width change between consecutive segments of one street (m)
#street.maxStepPerEdge=2.5
# Max width change per phase (prevents runaway widening) (m)
#street.maxRatePerPhase=3.0
# 0..1 how strongly local widths adapt toward facade heights
#street.proportionNudge=0.25
# Junction opening radius as a multiple of half the widest street
#street.junctionExpansion=1.3
# Sampled origins for trip/betweenness demand estimate
#demand.sampleRoots=50
# Total weight of local (non-centre) trips
#demand.localTripWeight=3.0

# ===== Plazas (section C) =====
# Plaza radius in mean incident street widths (2-5)
#plaza.radiusWidths=2.2
# 0..1 plaza-formation tendency (shifts the threshold)
#plaza.tendency=0.5
# Score needed to form a plaza
#plaza.enterThreshold=0.66
# Score below which a non-central plaza dissolves (hysteresis)
#plaza.exitThreshold=0.52
# Minimum spacing between plazas (m)
#plaza.minSpacing=140
# Maximum plazas (scarcity)
#plaza.maxCount=8
# Plaza enlargement when a landmark fronts it
#plaza.landmarkFactor=1.5

# ===== Vistas and enclosure (section D) =====
# Max unbroken straight run / view in street widths (4-10)
#vista.maxWidths=8
# Spacing of vista samples along streets (m)
#vista.sampleSpacing=12
# Longest evaluated sightline (m)
#vista.maxRay=600

# ===== Blocks and houses (section E) =====
# Smallest face treated as a block (m2)
#block.minArea=300
# Blocks larger than this attract a cutting passage/street (m2)
#block.maxArea=8500
# Faces larger than this stay as fields (m2)
#block.maxHousingFace=45000
# Minimum house frontage (m)
#block.houseFrontageMin=4.5
# Maximum house frontage (m)
#block.houseFrontageMax=8.0
# Typical house frontage (m)
#block.houseFrontageTarget=6.0
# Minimum house depth (m)
#block.houseDepthMin=8
# Maximum house depth (m)
#block.houseDepthMax=15
# Share of perimeter units built (rest are yards)
#block.continuity=0.9
# Footprint area counted as one house when measuring density (m2)
#density.houseUnitArea=60
# Close any stretch of a built block's street edge still left open with a hofje-style garden wall and a door into the courtyard
#block.gateWalls=true
# Fill any stretch of a block outline left without a building (wedges, collapsed corners, rejected plots) with infill and corner buildings, so street walls are closed
#block.infill=true
# If > 0, target frontage = this x plot depth (1.0 = square plots); 0 uses houseFrontageTarget
#block.frontageToDepth=0.0
# Block corners sharper than this stay open as a small paved square instead of a pointed house
#block.minCornerAngleDeg=70
# Gaps in a street wall up to this many blocks are absorbed by the neighbouring house
#block.gapFillDepth=6
# Along the street, a house may widen this many cells to close a gap in the street wall before a hofje wall is used
#block.gapFillFront=9
# Blocks with longer perimeter get a passage into the garden (m)
#block.passageMinPerimeter=220
# Block outline simplification tolerance (m)
#block.simplifyTolerance=0.9
# Minimum block outline edge after simplification (m)
#block.minEdge=4.5
# Hard minimum footprint area (m2)
#house.minArea=14
# Hard minimum footprint edge (m)
#house.minEdge=2.2
# Hard minimum footprint interior angle (degrees)
#house.minAngleDeg=20

# ===== Architecture (section N) =====
# Typical storey height (m)
#arch.floorHeight=3.4
# Extra ground-floor height (m)
#arch.groundFloorExtra=0.8
# Width/height target R on local streets
#arch.rTarget.local=1.0
# Width/height target R on connectors
#arch.rTarget.connector=1.0
# Relaxed R on primary streets
#arch.rTarget.primary=1.4
# Relaxed R on civic approaches
#arch.rTarget.civic=1.6
# Relaxed R for plaza frontages (plaza diameter / height)
#arch.rTarget.plaza=2.5
# Max share of houses in tier 2 (scarcity)
#arch.tier2Quota=0.12
# Share of buildings that are restaurants (ground-floor dining, home above, outdoor seating)
#use.restaurantShare=0.04
# Share of buildings that are standalone bookstores
#use.bookstoreShare=0.025
# Share of buildings with a shop on the ground floor and a home above
#use.mixedShare=0.2
# Share of corner and infill buildings used as shops (ground-floor shop, rooms above)
#use.cornerShopShare=0.7
# Shops, bookstores and restaurants only on streets of at least this class (1 lane, 2 connector, 3 main street, 4 civic) or on a plaza; smaller streets stay residential
#use.minStreetClass=3
# Share of homes whose entrance is flanked by painted wood (all shops have one)
#use.accentDoorShare=0.3
# Player's storey limit for houses (0 = automatic, 4 at Minecraft scale); set with the storeys=<n> command option
#mc.maxStoreys=0
# Multiplier on storey counts from street proportions (set automatically when storeys=<n> is above the usual limit)
#arch.heightScale=1.0
# Hard cap on storeys for any house, including plaza frontages (monuments excepted)
#arch.maxFloors=6
# Hard cap on house height / frontage, so narrow plots never become towers
#arch.maxHeightToFrontage=3.0
# Importance needed for tier 2
#arch.tier2Threshold=0.45
# Max share of houses in tier 4
#arch.tier4Share=0.15
# Explicit historical synthesis by district (intentional blend, not period-authentic)
#arch.synthesis=core=georgian_classical;outer=medieval_vernacular;monument=neoclassical_monumental
# Core district radius as fraction of city radius
#arch.coreRadiusFraction=0.42

# ===== Minecraft (1 block = 1 m) =====
# Derive growth radius, budget and centre spacing from the command radius (keys you set explicitly win)
#mc.scaleToRadius=true
# Extra terrain sampled beyond the radius (blocks)
#mc.margin=16
# Smallest radius accepted by the command
#mc.minRadius=48
# Largest radius accepted by the command
#mc.maxRadius=400
# Server time per tick spent on sampling/placing (ms); lower = smoother, slower
#mc.tickBudgetMs=25
# Smoothing of sampled heights before simulation (blocks)
#mc.blurRadius=3
# Smallest storey height in blocks
#mc.storeyMinBlocks=3
# Chance per garden cell of a small tree
#mc.gardenTreeChance=0.015
# Place a lantern on each storey and in plazas (stops mob spawns)
#mc.lanterns=true
# Fountain in central plazas
#mc.fountains=true
# Leave existing man-made structures (villages, earlier builds) untouched: streets route around them, nothing is built on them
#mc.preserveStructures=true
# Distance between glowstone lamp posts along streets (blocks); 0 = no lamps
#mc.lampSpacing=12
# Town material palette: warm (sandstone/plaster, red tile roofs), redbrick (brick facades in several tones, red nether brick roofs), brick, whitewash or stone (slate roofs)
#mc.palette=warm
# 0..1 share of street blocks built in the district's alternate wall tone (0 = fully uniform)
#mc.paletteVariation=0.0
# uniform = every house gets the same pitched roof with eaves to the street; auto = by style (parapets, gables)
#mc.roofForm=uniform
# Street-side houses are built from unit designs (structure files: ground, shop, upper and roof pieces) on plots sized to the units; off = every house drawn from scratch (command option 'units=off')
#mc.units=true
# Largest difference (degrees) between a street and the angle a unit was designed for (designs exist every 11.25 degrees)
#units.maxAngleError=8.0
# Highest a pitched roof rises above the top storey (blocks)
#mc.maxRoofRise=4
# Villager mode: most surveyor villagers growing streets at once
#mc.live.surveyors=12
# Villager mode: most mason villagers building at once
#mc.live.masons=16
# Villager mode: walking speed in blocks per tick (they hurry on long trips)
#mc.live.walkSpeed=0.32
# Villager mode: blocks one mason places per tick on a house
#mc.live.buildRate=10
# Villager mode: blocks per tick when paving a block or a plaza
#mc.live.groundRate=40
# Evolving town: seconds between town reviews (each review grows streets a little and changes a few buildings)
#mc.evolve.cycleSeconds=60
# Evolving town: buildings changed per review (raise, rebuild, merge, split, clear)
#mc.evolve.changesPerCycle=4
# Evolving town: street growth decisions per review (never beyond the command radius)
#mc.evolve.growthSteps=12
# Evolving town: surveyors kept on the job after the town is complete
#mc.evolve.surveyors=2
# Evolving town: masons kept on the job after the town is complete
#mc.evolve.masons=4
# Evolving town: reviews a cleared lot stays a garden before it is rebuilt
#mc.evolve.vacantCycles=4
# Evolving town: reviews before a building may be demolished and rebuilt
#mc.evolve.minAgeCycles=5
# Evolving town: relative frequency of each kind of building change (redevelop clears a whole block for re-planning)
#mc.evolve.weights=raise=3,renew=2.5,convert=2,merge=1.5,split=1,clear=1.2,redevelop=0.6
# Evolving town: streets re-laid per review when their width has drifted with traffic (widen into free space or narrow)
#mc.evolve.relaysPerCycle=3
# Evolving town: post a chat summary every this many reviews
#mc.evolve.reportEvery=5
# Evolving town: stop by itself after this many minutes (0 = until /emergentcity stop)
#mc.evolve.maxMinutes=0
# With the 'maintain' option: seconds before a mason replaces a house block a player broke (sneak-break to remove a block for good)
#mc.maintain.delaySeconds=30
# Villager mode: how far a surveyor re-reads the terrain before deciding (blocks)
#mc.live.senseRadius=24

# ===== Objective lambdas for the reported composite score (section H / N) =====
# Weight of E_streets in the reported objective
#lambda.streets=1.0
# Weight of E_vistas in the reported objective
#lambda.vistas=1.0
# Weight of E_blocks in the reported objective
#lambda.blocks=1.0
# Weight of E_proportions in the reported objective
#lambda.proportions=1.0
# Weight of E_centers in the reported objective
#lambda.centers=1.0
# Weight of E_terrain in the reported objective
#lambda.terrain=1.0
# Weight of E_accessibility in the reported objective
#lambda.accessibility=1.0
# Weight of E_hierarchy in the reported objective
#lambda.hierarchy=1.0
# Weight of E_archProportion in the reported objective
#lambda.archProportion=1.0
# Weight of E_facadeRhythm in the reported objective
#lambda.facadeRhythm=1.0
# Weight of E_ornament in the reported objective
#lambda.ornament=1.0
# Weight of E_neighbor in the reported objective
#lambda.neighbor=1.0
# Weight of E_style in the reported objective
#lambda.style=1.0
